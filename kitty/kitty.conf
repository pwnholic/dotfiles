# include themes/mocha.conf

# Installed Iosevka font, including Nerd Font glyphs.
font_family IosevkaTermSlab Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.5
disable_ligatures always
text_composition_strategy platform
undercurl_style thin-sparse

# Fish/Neovim own cursor shape for their editing modes.
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0
cursor_trail 0
shell_integration no-cursor

scrollback_lines 10000
scrollback_pager_history_size 64
# Official Neovim >= 0.12 recipe, isolated from plugins and shada.
scrollback_pager nvim --clean -n -i NONE --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
scrollback_fill_enlarged_window yes
pixel_scroll yes
touch_scroll_multiplier 1.0
mouse_hide_wait 3
url_style curly
detect_urls yes
allow_hyperlinks yes
strip_trailing_spaces smart
copy_on_select no

# Allow batching for full-screen editor redraws.
repaint_delay 10
input_delay 3
sync_to_monitor yes
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell yes

remember_window_size yes
window_margin_width 0
window_padding_width 6
window_border_width 1
draw_minimal_borders yes
inactive_text_alpha 1.0
hide_window_decorations yes
confirm_os_window_close -1 count-background
close_on_child_death no
enabled_layouts splits,stack,tall

tab_bar_min_tabs 2
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_font_style bold
inactive_tab_font_style normal
background_opacity 0.7
background_blur 0
dynamic_background_opacity yes
dim_opacity 0.6

shell /usr/bin/fish
editor /usr/bin/nvim
term xterm-kitty
linux_display_server auto
wayland_enable_ime no
allow_remote_control no
allow_cloning ask
auto_reload_config 0.1
# Nerd Fonts v3.4.0

symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# Ctrl+Shift belongs to Kitty; Ctrl and Alt remain available to Vim/Fish.
clear_all_shortcuts yes
kitty_mod ctrl+shift
map --allow-fallback=shifted,ascii ctrl+shift+c copy_or_noop
map --allow-fallback=shifted,ascii ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_selection
map --allow-fallback=shifted,ascii ctrl+shift+equal change_font_size all +1.0
map --allow-fallback=shifted,ascii ctrl+shift+minus change_font_size all -1.0
map --allow-fallback=shifted,ascii ctrl+shift+backspace change_font_size all 0

# Splits inherit the current directory. D = right, O = below.
map kitty_mod+enter launch --location=split --cwd=current
map kitty_mod+d launch --location=vsplit --cwd=current
map kitty_mod+o launch --location=hsplit --cwd=current
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right
map kitty_mod+r start_resizing_window
map kitty_mod+z toggle_layout stack
map kitty_mod+w close_window_with_confirmation
map kitty_mod+t launch --type=tab --cwd=current
map kitty_mod+page_down next_tab
map kitty_mod+page_up previous_tab
map kitty_mod+alt+t set_tab_title
map kitty_mod+n new_os_window_with_cwd

# Read/copy/search output using Vim motions; q closes the pager.
map kitty_mod+b show_scrollback
map kitty_mod+g show_last_command_output
map kitty_mod+up scroll_to_prompt -1
map kitty_mod+down scroll_to_prompt 1
map kitty_mod+u kitten hints --type url
map kitty_mod+p kitten hints --type path --program -
map kitty_mod+f2 edit_config_file
map kitty_mod+f5 load_config_file
map kitty_mod+f6 debug_config
