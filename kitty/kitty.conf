font_family IosevkaTermSlab Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.5

disable_ligatures always
text_composition_strategy platform
undercurl_style thin-sparse
box_drawing_scale 0.001, 1, 1.5, 2

symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0
cursor_stop_blinking_after 0
cursor_trail 0

scrollback_lines 10000
scrollback_pager_history_size 64
scrollback_fill_enlarged_window no

pixel_scroll yes
touch_scroll_multiplier 1.0

mouse_hide_wait -1.0

url_style curly
detect_urls yes
allow_hyperlinks yes
strip_trailing_spaces smart
click_interval -1.0

repaint_delay 6
input_delay 0
sync_to_monitor yes

enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell yes
bell_on_tab "🔔 "

remember_window_size yes
window_margin_width 0
window_padding_width 0
single_window_margin_width 0
single_window_padding_width 0
placement_strategy top-left

window_border_width 0
draw_minimal_borders yes
inactive_text_alpha 1.0

resize_debounce_time 0.03 0.1

confirm_os_window_close -1 count-background
hide_window_decorations yes
close_on_child_death no

tab_bar_style hidden

background_opacity 0.7
background_blur 0
dynamic_background_opacity no
dim_opacity 0.4

shell fish
editor nvim

shell_integration no-cursor

allow_remote_control no
allow_cloning ask

update_check_interval 24
auto_reload_config 0.1

term xterm-kitty


linux_display_server wayland
wayland_enable_ime no

clear_all_shortcuts yes

map --allow-fallback=shifted,ascii ctrl+shift+c copy_or_noop
map --allow-fallback=shifted,ascii ctrl+shift+v paste_from_clipboard

map shift+insert paste_from_selection

map --allow-fallback=shifted,ascii ctrl+shift+equal change_font_size all +2.0
map --allow-fallback=shifted,ascii ctrl+shift+minus change_font_size all -2.0
map --allow-fallback=shifted,ascii ctrl+shift+backspace change_font_size all 0
