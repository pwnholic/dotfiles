# =============================================================================
# kitty.conf  --  tuned for THIS machine
# -----------------------------------------------------------------------------
# Hardware/OS context used to choose these values (verified, not assumed):
#   - ASUS V16 V3607VH, CachyOS, kernel 7.1.4
#   - Display server : Wayland (XDG_SESSION_TYPE=wayland, compositor: niri)
#   - Internal panel : 1920x1200 @ 144 Hz (scale 1, ~141 DPI)
#   - External       : 1920x1080 @ 60 Hz (HDMI)
#   - Shell          : fish   |   Editor : nvim 0.12.4
#   - Font installed : Iosevka Nerd Font Mono
# Reference (official): https://sw.kovidgoyal.net/kitty/conf/
#
# NOTE on comments: kitty only supports FULL-LINE comments that start with '#'
# as the very first character of the line. Trailing inline comments after a
# value are NOT parsed and would break the option. See "Comments" in the docs.
# Reload after edits with ctrl+shift+f5  (auto_reload_config is on below).
# =============================================================================


# =============================================================================
# Performance tuning  (https://sw.kovidgoyal.net/kitty/conf/#performance-tuning)
# =============================================================================
# Delay between screen redraws in ms. Lower = higher max FPS, more CPU.
# This panel runs at 144 Hz (frame time ~6.94 ms), so 5 ms lets kitty keep a
# frame ready for every vsync without capping below the panel rate.
# Docs: "The default value yields ~100 FPS"; lowering raises FPS at CPU cost,
# and this option is ignored when input is pending (lowest latency path).
repaint_delay 5

# Delay (ms) before program output is processed. Default is 3. Lowering it
# increases responsiveness but can cause FLICKER in full-screen TUIs (e.g. nvim)
# because partial updates get drawn. We keep the default for flicker-free nvim.
# Docs: "decreasing it ... might cause flicker in full screen programs".
input_delay 3

# Sync redraws to the monitor refresh rate. YES prevents screen tearing while
# scrolling (quality over raw speed). With a 144 Hz panel we still get up to
# ~144 FPS, tear-free. Docs: prevents tearing; limits render speed to refresh.
sync_to_monitor yes


# =============================================================================
# Fonts  (https://sw.kovidgoyal.net/kitty/conf/#fonts)
# =============================================================================
# "Iosevka Nerd Font Mono" is the MONO (single-cell-width) variant -> correct
# for a terminal. Verified with: fc-match "Iosevka Nerd Font Mono".
# bold/italic/bold_italic are left at 'auto', which resolves to the matching
# faces in the same family via fontconfig (Bold/Italic/Oblique all present).
font_family      Iosevka Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# Slightly larger than the 11.0 default for a 16" 1920x1200 @ scale 1 panel.
# Tunable on the fly with ctrl+shift+= / ctrl+shift+-.
font_size 12.0

# Render programming ligatures (Iosevka ships calt ligatures). 'never' means
# always render them. Options: never | cursor | always. Use 'cursor' if you
# prefer ligatures to disappear when the cursor is over them while editing.
disable_ligatures never

# How glyphs are composited onto the background. 'platform' aims for rendering
# closest to the OS-native look on Linux (best text quality out of the box).
# Docs: the default 'platform' tries native text rendering for the platform.
text_composition_strategy platform

# Map every Nerd Font symbol codepoint to the standalone "Symbols Nerd Font
# Mono" (the Mono variant is single-cell-width, which a terminal requires).
# kitty already has a built-in Nerd font and would fall back to it, but adding
# this forces the PURE symbol glyphs to be used even though our main font
# (Iosevka Nerd Font Mono) is itself a patched Nerd font. This is the EXACT
# line recommended in the kitty FAQ (Nerd Fonts v3.4.0), copied verbatim.
# Reference: https://sw.kovidgoyal.net/kitty/faq/#kitty-is-not-able-to-use-my-favorite-font
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono


# =============================================================================
# Text cursor  (https://sw.kovidgoyal.net/kitty/conf/#text-cursor-customization)
# =============================================================================
cursor_shape            beam
cursor_shape_unfocused  hollow

# -1 = use the system default blink interval. (An animated value like
# "0.5 ease-in-out" looks great but draws extra power; kept conservative here.)
cursor_blink_interval   -1

# Cursor "trail" animation: draws a fading trail following large cursor jumps.
# GPU-accelerated and trivial for the RTX 5050; makes the terminal feel premium.
# Value = ms the cursor must rest before a trail triggers (filters out jitter).
# Set to 0 to disable if you find it distracting. Docs: "cursor_trail" option.
cursor_trail                3
cursor_trail_decay          0.1 0.4
cursor_trail_start_threshold 2


# =============================================================================
# Scrollback  (https://sw.kovidgoyal.net/kitty/conf/#scrollback)
# =============================================================================
# In-memory scrollback (kept modest to limit RAM use). Docs warn very large
# values slow the terminal; use the pager history below for deep history.
scrollback_lines 10000

# Separate, larger on-disk history piped to the pager only (~10k lines/MB for
# ASCII). 25 MB ~= deep history without bloating the interactive buffer/RAM.
scrollback_pager_history_size 25

# View scrollback in nvim (the configured editor). This is the exact command
# from the official docs and requires nvim >= 0.12 (installed: 0.12.4). Press
# 'q' to quit the pager. Docs: scrollback_pager nvim example.
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

# Per-pixel (sub-line) scrolling in kitty's own scrollback on high-precision
# devices (trackpad). Default yes; kept explicit. Docs: pixel_scroll.
pixel_scroll yes

# Friction for inertial (momentum) scrolling. Applies on Wayland (native
# momentum is used on macOS). 0 = none, 1 = infinite. Default 0.96.
momentum_scroll 0.96


# =============================================================================
# Mouse / URLs  (https://sw.kovidgoyal.net/kitty/conf/#mouse)
# =============================================================================
detect_urls yes
url_style    curly


# =============================================================================
# Terminal bell  (https://sw.kovidgoyal.net/kitty/conf/#terminal-bell)
# =============================================================================
# Disable the audio beep (polite in shared/quiet spaces). A bell symbol still
# appears on the tab (bell_on_tab) and the window can still request attention.
enable_audio_bell no
window_alert_on_bell yes
bell_on_tab "🔔 "


# =============================================================================
# Window layout  (https://sw.kovidgoyal.net/kitty/conf/#window-layout)
# =============================================================================
# niri is a tiling compositor, so it manages sizing/placement. These only add
# internal padding for readable gutters; remember_window_size stays default yes.
window_padding_width 8
draw_minimal_borders yes
window_border_width  0.5pt


# =============================================================================
# Tab bar  (https://sw.kovidgoyal.net/kitty/conf/#tab-bar)
# =============================================================================
# 'powerline' separators are drawn by kitty itself (no patched font needed), so
# they render correctly with Iosevka Nerd Font Mono. 'slanted' = powerline shape.
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_min_tabs    1

# Tab colors (dark, blue accent) chosen to read well against kitty's default
# black background. Swap freely, or replace the whole palette with a theme via:
#   kitten themes   (see https://sw.kovidgoyal.net/kitty/kittens/themes/)
active_tab_foreground   #11121d
active_tab_background   #7aa2f7
active_tab_font_style   bold
inactive_tab_foreground #a9b1d6
inactive_tab_background #1a1b26
inactive_tab_font_style normal


# =============================================================================
# Color scheme  (https://sw.kovidgoyal.net/kitty/conf/#color-scheme)
# =============================================================================
# Terminal fg/bg and the 256-color palette are left at kitty defaults to avoid
# imposing a theme. To install a curated theme instead, run:  kitten themes
# Background is fully opaque (1.0): docs note background_opacity < 1.0 is
# "a (possibly significant) performance hit" and can degrade text rendering.
background_opacity 0.7


# =============================================================================
# Advanced  (https://sw.kovidgoyal.net/kitty/conf/#advanced)
# =============================================================================
# '.' = use $SHELL (fish) / $EDITOR,$VISUAL (nvim). Explicit for clarity.
shell  .
editor .

# DO NOT change 'term' casually. Docs explicitly warn changing it can break
# keypresses, colors and features in many programs. Leave it as xterm-kitty.
term xterm-kitty

# Shell integration enables prompt jumping, last-command-output pager, cwd
# tracking, etc. (supported by fish). allow_hyperlinks enables OSC 8 links.
shell_integration enabled
allow_hyperlinks   yes

# Desktop notification when a long-running command finishes in an UNFOCUSED
# window (needs shell_integration). Default threshold is 5 s; we use 10 s to
# avoid spam. Docs: notify_on_cmd_finish.
notify_on_cmd_finish unfocused 10.0

# CachyOS ships kitty as a distro package; update checks only run for the
# official binary builds, so we disable the periodic network check.
update_check_interval 0

# Auto-reload this file ~0.1 s after it changes (debounced). Manual reload:
# ctrl+shift+f5. Docs: auto_reload_config.
auto_reload_config 0.1


# =============================================================================
# OS specific tweaks -- Wayland  (https://sw.kovidgoyal.net/kitty/conf/#os-specific-tweaks)
# =============================================================================
# We are on Wayland (niri). Forcing the Wayland backend is safe here because
# niri is a Wayland-only compositor. Docs: linux_display_server (auto|wayland|x11).
linux_display_server wayland

# Disable the Wayland IME/text-input protocol. Docs: its Wayland implementation
# "is often buggy and introduces latency into the input loop, so disable this
# if you know you dont need it." We type Latin scripts (no CJK IME), so we turn
# it off for lower-latency input.
wayland_enable_ime no

# Remove the titlebar/borders for a clean, borderless look under the niri
# tiling compositor. Docs: hide_window_decorations (yes|no|titlebar-only ...).
hide_window_decorations no


# =============================================================================
# Handy shortcuts (defaults, listed for reference -- https://sw.kovidgoyal.net/kitty/conf/#keyboard-shortcuts)
# =============================================================================
# ctrl+shift+f2  edit this config file
# ctrl+shift+f5  reload this config file
# ctrl+shift+f6  debug kitty configuration
# ctrl+shift+=   increase font size      ctrl+shift+-  decrease      ctrl+shift+backspace  reset
# ctrl+shift+t   new tab                 ctrl+shift+q close tab
# ctrl+shift+enter new window            ctrl+shift+] / [  next/prev window
# ctrl+shift+g   browse last command output in pager (needs shell integration)
# ctrl+shift+e   open URL under cursor with hints
