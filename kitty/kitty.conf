# kitty.conf -- tuned for THIS machine (kitty 0.48.2)
#
# Hardware/OS context (verified, not assumed):
#   - ASUS V16 V3607VH, CachyOS, kernel 7.1.4
#   - Display server : Wayland (XDG_SESSION_TYPE=wayland, compositor: niri)
#   - Internal panel : 1920x1200 @ 144 Hz (scale 1, ~141 DPI)
#   - External       : 1920x1080 @ 60 Hz (HDMI)
#   - Shell          : fish   |   Editor : nvim
#   - Font installed : Iosevka Nerd Font Mono
#   - Desktop theme  : Tokyo Night Storm (matches Noctalia palette)
#
# Reference (official): https://sw.kovidgoyal.net/kitty/conf/
#
# NOTE: kitty only supports FULL-LINE comments that start with '#' as the very
# first character. Trailing inline comments after a value are NOT parsed and
# would break the option. Reload after edits with ctrl+shift+f5
# (auto_reload_config is on below).

# Performance tuning
# repaint_delay: delay between redraws in ms. Lower = higher max FPS, more CPU.
# This 144 Hz panel has a frame time of ~6.94 ms, so 5 ms keeps a frame ready
# for every vsync without capping below the panel rate. Ignored while input is
# pending (lowest-latency path). Docs: default yields ~100 FPS.
repaint_delay 5

# input_delay: delay before program output is processed. Default 3. Lowering
# increases responsiveness but can flicker in full-screen TUIs (nvim) because
# partial updates get drawn. Kept at default for flicker-free nvim.
input_delay 3

# sync_to_monitor: sync redraws to the refresh rate. Prevents tearing while
# scrolling; with a 144 Hz panel we still get up to ~144 FPS, tear-free.
sync_to_monitor yes

# Fonts
# Iosevka Nerd Font Mono is the MONO (single-cell-width) variant, correct for
# a terminal. bold/italic are left 'auto' so fontconfig resolves the matching
# faces in the same family.
font_family      Iosevka Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# Slightly larger than the 11.0 default for a 16" 1920x1200 panel at scale 1.
# Tunable on the fly with ctrl+shift+= / ctrl+shift+-.
font_size 12.0

# Render programming ligatures (Iosevka ships calt ligatures).
# never = always render | cursor = turn off under cursor | always = never render.
disable_ligatures never

# 'platform' gives the closest-to-native text rendering on Linux.
text_composition_strategy platform

# Map every Nerd Font symbol codepoint to the standalone Symbols Nerd Font Mono
# (single-cell-width, required for a terminal). This is the exact line from the
# kitty FAQ (Nerd Fonts v3.4.0) and forces the pure symbol glyphs to be used.
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# Slightly tuned glyph metrics for a cleaner, denser line.
modify_font underline_position 2
modify_font underline_thickness 100%
modify_font strikethrough_thickness 100%
modify_font strikethrough_position 2px
modify_font cell_width 103%
modify_font cell_height 2px

# Text cursor
cursor_shape            beam
cursor_shape_unfocused  hollow

# -1 = system default blink interval.
cursor_blink_interval -1

# Cursor "trail" animation: a fading trail following large cursor jumps.
# GPU-accelerated and trivial for the RTX 5050; makes the terminal feel
# premium. threshold filters out jitter. Set trail to 0 to disable.
cursor_trail                3
cursor_trail_decay          0.1 0.4
cursor_trail_start_threshold 2

# Scrollback
# In-memory scrollback kept modest to limit RAM use; large values slow the
# terminal. Use the pager history below for deep history.
scrollback_lines 10000

# Separate, larger on-disk history piped to the pager only (~10k lines/MB for
# ASCII). 25 MB ~= deep history without bloating the interactive buffer/RAM.
scrollback_pager_history_size 25

# View scrollback in nvim (the configured editor). Requires nvim >= 0.12.
# Press 'q' to quit. This is the exact command from the official docs.
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

# Per-pixel (sub-line) scrolling on high-precision devices (trackpad).
pixel_scroll yes

# Friction for inertial (momentum) scrolling. 0 = none, 1 = infinite.
momentum_scroll 0.96

# Mouse / URLs
detect_urls yes
url_style    curly

# Copy on select: selecting text with the mouse immediately copies it to the
# Wayland clipboard, so no need to press ctrl+shift+c (and no way to miss it).
# Remove this line to go back to kitty's default (select only; copy via
# ctrl+shift+c). Other default bindings are unchanged.
copy_on_select clipboard

# Terminal bell
# Disable the audio beep (polite in shared spaces). A bell symbol still appears
# on the tab and the window can still request attention.
enable_audio_bell no
window_alert_on_bell yes
bell_on_tab "🔔 "

# Window layout
# niri is a tiling compositor, so it manages sizing/placement. No internal
# padding so the terminal fills the whole window edge-to-edge.
window_padding_width 0
draw_minimal_borders yes
window_border_width  0.5pt

# Tab bar
# 'powerline' separators are drawn by kitty itself (no patched font needed),
# so they render correctly with Iosevka Nerd Font Mono. 'slanted' = powerline.
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_min_tabs    2

# Tab colors from the Tokyo Night Storm palette.
active_tab_foreground   #1f2335
active_tab_background   #7aa2f7
active_tab_font_style   bold
inactive_tab_foreground #545c7e
inactive_tab_background #292e42
inactive_tab_font_style normal

# Color scheme -- Tokyo Night Storm (matches Noctalia desktop theme)
# Source: https://github.com/folke/tokyonight.nvim (extras/kitty/tokyonight_storm.conf)
background              #24283b
foreground              #c0caf5
selection_foreground    #c0caf5
selection_background    #2e3c64
url_color               #73daca
cursor                  #c0caf5
cursor_text_color       #24283b
active_border_color     #7aa2f7
inactive_border_color   #292e42

# Normal colors
color0  #1d202f
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6

# Bright colors
color8  #414868
color9  #ff899d
color10 #9fe044
color11 #faba4a
color12 #8db0ff
color13 #c7a9ff
color14 #a4daff
color15 #c0caf5

# Extended colors (16/256-color palette anchors)
color16 #ff9e64
color17 #db4b4b

# Background opacity
# Fully opaque (1.0): the desktop already runs niri with blur disabled for all
# windows, and a translucent background would show the wallpaper through the
# text. Opaque also avoids the documented performance hit for opacity < 1.0.
background_opacity 1.0

# Advanced
# '.' = use $SHELL (fish) / $EDITOR,$VISUAL (nvim). Explicit for clarity.
shell  .
editor .

# Leave 'term' as xterm-kitty; changing it can break keypresses, colors and
# features in many programs.
term xterm-kitty

# Shell integration enables prompt jumping, last-command-output pager, cwd
# tracking, etc. (supported by fish). allow_hyperlinks enables OSC 8 links.
shell_integration enabled
allow_hyperlinks   yes

# Desktop notification when a long-running command finishes in an UNFOCUSED
# window (needs shell_integration). Default threshold is 5 s; 10 s avoids spam.
notify_on_cmd_finish unfocused 10.0

# CachyOS ships kitty as a distro package; update checks only run for the
# official binary builds, so the periodic network check is disabled.
update_check_interval 0

# Auto-reload this file ~0.1 s after it changes (debounced). Manual reload:
# ctrl+shift+f5.
auto_reload_config 0.1

# OS specific tweaks -- Wayland
# niri is Wayland-only, so forcing the Wayland backend is safe.
linux_display_server wayland

# Disable the Wayland IME/text-input protocol. Its implementation "is often
# buggy and introduces latency into the input loop". We type Latin scripts (no
# CJK IME), so turn it off for lower-latency input.
wayland_enable_ime no

# Hide window decorations for a clean, borderless look under the niri tiling
# compositor (niri provides its own window management).
hide_window_decorations yes