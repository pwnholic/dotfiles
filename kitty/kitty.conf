# ============================================================================
# kitty.conf — tuned untuk:
#   OS    : CachyOS (Arch-based), kernel 7.1.8, sesi Wayland
#   CPU   : Intel Core 5 210H (12 thread)
#   GPU   : Intel Iris-Xe (Raptor Lake-P) + NVIDIA RTX 5050 Max-Q
#   RAM   : 16 GB
#   Layar : 1920x1200 (16:10)
#   kitty : 0.48.2
# Acuan: https://sw.kovidgoyal.net/kitty/conf/
# ============================================================================

# ----------------------------------------------------------------------------
# Fonts — Iosevka Term Slab: varian "Term" dibuat khusus untuk terminal
# (lebar sel seragam, tanpa ligatur aktif). Bold/italic/bold-italic diselesaikan
# otomatis oleh kitty dari famili yang sama (semua style sudah terinstal).
# ----------------------------------------------------------------------------
font_family      Iosevka Term Slab
bold_font        auto
italic_font      auto
bold_italic_font auto

# 12.5 pt nyaman di panel 1920x1200 16:10 (dot pitch ~0.216mm pada 14")
font_size 12.5

# Jangan render ligatur saat kursor menimpanya (mudah diedit);
# varian Term memang minim ligatur, jadi ini hanya pengaman.
disable_ligatures cursor

# Strategi komposit teks default Linux (gamma 1.0, kontras 0) —
# paling tebal/tegas di tema gelap tanpa artefak.
text_composition_strategy platform

# Undercurl tipis-sparse: paling tajam di DPI layar ini.
undercurl_style thin-sparse

# Skala box-drawing default (di-scale otomatis oleh DPI monitor).
box_drawing_scale 0.001, 1, 1.5, 2


# Map every Nerd Font symbol codepoint to the standalone Symbols Nerd Font Mono
# (single-cell-width, required for a terminal). This is the exact line from the
# kitty FAQ (Nerd Fonts v3.4.0) and forces the pure symbol glyphs to be used.
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# Slightly tuned glyph metrics for a cleaner, denser line.
modify_font underline_position 2
modify_font underline_thickness 100%
modify_font strikethrough_thickness 100%
modify_font strikethrough_position 2px
modify_font cell_width 103%
modify_font cell_height 2px

# ----------------------------------------------------------------------------
# Cursor
# ----------------------------------------------------------------------------
cursor_shape block
cursor_shape_unfocused hollow
cursor_trail 3
cursor_trail_decay 0.1 0.4

# ----------------------------------------------------------------------------
# Scrollback — RAM 16GB aman; dialokasikan on-demand.
# ----------------------------------------------------------------------------
scrollback_lines 10000
scrollback_pager_history_size 25
scrollback_fill_enlarged_window no
pixel_scroll yes

# ----------------------------------------------------------------------------
# Mouse
# ----------------------------------------------------------------------------
mouse_hide_wait 3.0
url_style curly
detect_urls yes
strip_trailing_spaces smart
click_interval -1.0

# ----------------------------------------------------------------------------
# Performance — default resmi sudah optimal (~100 FPS, anti-tearing).
# iGPU Intel cukup untuk ini; sync_to_monitor=yes mencegah tearing saat scroll.
# ----------------------------------------------------------------------------
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ----------------------------------------------------------------------------
# Terminal bell — senyap, tanpa visual bell.
# ----------------------------------------------------------------------------
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab "🔔 "

# ----------------------------------------------------------------------------
# Window layout
# ----------------------------------------------------------------------------
remember_window_size yes
initial_window_width 120c
initial_window_height 36c
window_padding_width 1
placement_strategy center
enabled_layouts *
window_border_width 0.5pt
draw_minimal_borders yes
confirm_os_window_close -1

# ----------------------------------------------------------------------------
# Tab bar
# ----------------------------------------------------------------------------
tab_bar_edge bottom
tab_bar_style fade
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"

# ----------------------------------------------------------------------------
# Color scheme & transparansi
# background_opacity < 1.0 adalah perf-hit (dokumen resmi) — GPU modern
# kamu menanganinya santai; blur hanya aktif jika compositor mendukung.
# ----------------------------------------------------------------------------
background_opacity 0.6
background_blur 0
dynamic_background_opacity no
dim_opacity 0.4

# ----------------------------------------------------------------------------
# Advanced
# ----------------------------------------------------------------------------
shell fish
editor .
close_on_child_death no
allow_remote_control no
update_check_interval 24
auto_reload_config 0.1
allow_hyperlinks yes
shell_integration enabled
term xterm-kitty

# Wayland: pilih backend otomatis (wayland).
# IME dimatikan karena tidak dipakai (dokumen: implementasi Wayland sering
# buggy dan menambah latensi input). Butuh input CJK? set `yes`.
linux_display_server auto
wayland_enable_ime no

# Modifier default untuk semua shortcut bawaan.
kitty_mod ctrl+shift

# ----------------------------------------------------------------------------
# Shortcut tambahan (di luar default) — semuanya aksi resmi kitty.
# ----------------------------------------------------------------------------
# Zoom sementara window aktif (toggle layout stack) — ctrl+alt+z sesuai contoh resmi,
# agar tidak menimpa ctrl+shift+z (scroll_to_prompt) bawaan.
map ctrl+alt+z toggle_layout stack
# Bersihkan layar + simpan isi layar ke scrollback
map ctrl+l clear_terminal to_cursor_scroll active

# ----------------------------------------------------------------------------
# Tema
# ----------------------------------------------------------------------------
include themes/noctalia.conf
