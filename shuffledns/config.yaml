# shuffledns config file
# generated by https://github.com/projectdiscovery/goflags

# domain to find or resolve subdomains for
#domain: []

# automatically extract root domains
#auto-domain: false

# file containing list of subdomains to resolve
#list: 

# file containing words to bruteforce for domain
#wordlist: 

# file containing list of resolvers for enumeration
#resolver: 

# file containing list of trusted resolvers
#trusted-resolver: 

# validate raw full massdns output
#raw-input: 

# execution mode (bruteforce, resolve, filter)
#mode: 

# number of concurrent massdns resolves
#t: 10000

# update shuffledns to latest version
#update: false

# disable automatic shuffledns update check
#disable-update-check: false

# file to write output to (optional)
#output: 

# make output format as ndjson
#json: false

# dump wildcard ips to output file
#wildcard-output: 

# path to the massdns binary
#massdns: 

# optional massdns commands to run (example '-i 10')
#massdns-cmd: 

# temporary directory for enumeration
#directory: 

# number of retries for dns enumeration
#retries: 5

# perform wildcard check on all found subdomains
#strict-wildcard: false

# number of concurrent wildcard checks
#wt: 250

# capture and store massdns stderr output (default: discard)
#retain-stderr: false

# number of lines per chunk for incremental processing
#batch-size: 500000

# show only subdomains in output
#silent: false

# show version of shuffledns
#version: false

# show verbose output
#v: false

# don't use colors in output
#no-color: false