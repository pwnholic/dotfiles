# tldfinder config file
# generated by https://github.com/projectdiscovery/goflags

# domain or list of domains for discovery (file or comma separated)
#domain: []

# specific sources to use for discovery (-s censys,dnsrepo). use -ls to display all available sources.
#sources: []

# sources to exclude from enumeration (-es censys,dnsrepo)
#exclude-sources: []

# discovery mode (dns,tld,domain)
#discovery-mode: dns

# use all sources for enumeration (slow)
#all: false

# domain or list of domain to match (file or comma separated)
#match: []

#  domain or list of domain to filter (file or comma separated)
#filter: []

# maximum number of http requests to send per second (global)
#rate-limit: 0

# maximum number of http requests to send per second four providers in key=value format (-rls hackertarget=10/m)
#rate-limits: ["waybackarchive=15/m", "whoisxmlapi=50/s", "whoisxmlapi=30/s"]

# number of concurrent goroutines for resolving (-active only)
#t: 10

# update tldfinder to latest version
#update: false

# disable automatic tldfinder update check
#disable-update-check: false

# file to write output to
#output: 

# write output in jsonl(ines) format
#json: false

# directory to write output (-dl only)
#output-dir: 

# include all sources in the output (-json only)
#collect-sources: false

# include host ip in output (-active only)
#ip: false

# flag config file
#config: /home/pwnholic/.config/tldfinder/config.yaml

# provider config file
#provider-config: /home/pwnholic/.config/tldfinder/provider-config.yaml

# comma separated list of resolvers to use
#r: []

# file containing list of resolvers to use
#rlist: 

# display active domains only
#active: false

# http proxy to use with tldfinder
#proxy: 

# exclude ips from the list of domains
#exclude-ip: false

# show only domains in output
#silent: false

# show version of tldfinder
#version: false

# show verbose output
#v: false

# disable color in output
#no-color: false

# list all available sources
#list-sources: false

# report source statistics
#stats: false

# seconds to wait before timing out
#timeout: 30

# minutes to wait for enumeration results
#max-time: 10