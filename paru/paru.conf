[options]
# Build PKGBUILDs in a chroot for maximum isolation/stability (needs devtools)
#Chroot
#Pacman = sudo -S pacman

# Combine repository and AUR upgrades into a single check/command
CombinedUpgrade

# Install all resolved packages in one batch instead of building/installing one by one
BatchInstall

# Detect and resolve providers (e.g. python vs python-pypy) during dependency checks
#UseAsk

# Enable searching by provider (recommended since v2.0)
Provides

# Track and update development packages (*-git, *-nightly)
#Devel

# Keep source files in the cache after a successful build (useful for inspection)
KeepSrc

# Remove makedepends after install (ask first)
RemoveMake = ask

# Show a detailed list of updates similar to pacman's VerbosePkgLists
UpgradeMenu

# Show the upgrade news feed before running an update
NewsOnUpgrade

# Redownload/reclone PKGBUILDs on every invocation (all = always, yes = ask)
#Redownload = all

# Sort search results: votes | popularity | name | submitted | modified
#SortBy = popularity

# Limit search results per repo+AUR (0 = no limit)
#Limit = 0

# How often (days) to refresh the completion cache (0=always, -1=never)
#CompletionInterval = 7

# Pager used to review diffs (default: bat if installed, falls back to diff/less)
#PagerCmd = bat --diff

# Review PKGBUILDs in a real file manager instead of the pager
#FileManager = nvim

# Invert search ordering so results go bottom-up
#BottomUp

# Do not show the confirm prompt when installing sway or other configured packages
#NoWarn = myPackageName
