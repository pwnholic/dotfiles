# naabu config file
# generated by https://github.com/projectdiscovery/goflags

# hosts to scan ports for (comma-separated)
#host: []

# list of hosts to scan ports (file)
#l: 

# hosts to exclude from the scan (comma-separated)
#eh: 

# list of hosts to exclude from scan (file)
#ef: 

# ports to scan (80,443, 100-200)
#p: 

# top ports to scan (default 100) [full,100,1000]
#tp: 

# ports to exclude from scan (file or comma-separated)
#ep: []

# list of ports to scan (file or comma-separated)
#pf: []

# port threshold to skip port scan for the host
#pts: 0

# skip full port scans for cdn/waf (only scan for port 80,443)
#ec: false

# display cdn in use
#cdn: false

# general internal worker threads
#c: 25

# packets to send per second
#rate: 1000

# update naabu to latest version
#update: false

# disable automatic naabu update check
#disable-update-check: false

# file to write output to (optional)
#output: 

# list of fields to output (comma separated)
#list-output-fields: false

# exclude output fields output based on a condition
#exclude-output-fields: []

# write output in json lines format
#json: false

# write output in csv format
#csv: false

# path to the naabu configuration file (default $home/.config/naabu/config.yaml)
#config: 

# scan all the ip's associated with dns record
#sa: false

# ip version to scan of hostname (4,6) - (default 4,6)
#iv: ["4", "6"]

# type of port scan (syn/connect)
#s: c

# source ip and port (x.x.x.x:yyy - might not work on osx) 
#source-ip: 

# payload to send in connect scans (optional)
#cp: 

# list available interfaces and public ip
#il: false

# network interface to use for port scan
#i: 

# invoke nmap scan on targets (nmap must be installed) - deprecated
#nmap: false

# nmap command to run on found results (example: -nmap-cli 'nmap -sv')
#nmap-cli: 

# list of custom resolver dns resolution (comma separated or from file)
#r: 

# socks5 proxy (ip[:port] / fqdn[:port]
#proxy: 

# socks5 proxy authentication (username:password)
#proxy-auth: 

# dns resolution order (p/l/lp/pl)
#dns-order: l

# use system dns as fallback resolver
#system-resolver: false

# resume scan using resume.cfg
#resume: false

# stream mode (disables resume, nmap, verify, retries, shuffling, etc)
#stream: false

# display passive open ports using shodan internetdb api
#passive: false

# timeout on input read
#input-read-timeout: 

# disable stdin processing
#no-stdin: false

# perform only host discovery
#host-discovery: false

# skip host discovery
#skip-host-discovery: false

# enable host discovery
#with-host-discovery: false

# tcp syn ping (host discovery needs to be enabled)
#probe-tcp-syn: []

# tcp ack ping (host discovery needs to be enabled)
#probe-tcp-ack: []

# icmp echo request ping (host discovery needs to be enabled)
#probe-icmp-echo: false

# icmp timestamp request ping (host discovery needs to be enabled)
#probe-icmp-timestamp: false

# icmp address mask request ping (host discovery needs to be enabled)
#probe-icmp-address-mask: false

# arp ping (host discovery needs to be enabled)
#arp-ping: false

# ipv6 neighbor discovery (host discovery needs to be enabled)
#nd-ping: false

# reverse ptr lookup for input ips
#rev-ptr: false

# service discovery
#service-discovery: false

# service version
#service-version: false

# number of retries for the port scan
#retries: 3

# millisecond to wait before timing out
#timeout: 

# time in seconds between scan phases
#warm-up-time: 2

# ping probes for verification of host
#ping: false

# validate the ports again with tcp verification
#verify: false

# predictive port scanning using port correlation model
#smart-scan: false

# minimum confidence for port predictions (0-100%)
#prediction-threshold: 20

# run diagnostic check up
#hc: false

# display debugging information
#debug: false

# display verbose output
#v: false

# disable colors in cli output
#nc: false

# display only results in output
#silent: false

# display version of naabu
#version: false

# display stats of the running scan (deprecated)
#stats: false

# number of seconds to wait between showing a statistics update (deprecated)
#stats-interval: 5

# port to expose naabu metrics on
#metrics-port: 63636

# configure projectdiscovery cloud (pdcp) api key
#auth: true

# configure projectdiscovery cloud (pdcp) api key credential file
#auth-config: 

# upload / view output in projectdiscovery cloud (pdcp) ui dashboard
#dashboard: false

# upload asset results to given team id (optional)
#team-id: 

# upload new assets to existing asset id (optional)
#asset-id: 

# assets group name to set (optional)
#asset-name: 

# upload naabu output file (jsonl) in projectdiscovery cloud (pdcp) ui dashboard
#dashboard-upload: 