# tlsx config file
# generated by https://github.com/projectdiscovery/goflags

# target host to scan (-u input1,input2)
#host: []

# target list to scan (-l input_file)
#list: 

# target port to connect (default 443)
#port: []

# tls connection mode to use (ctls, ztls, openssl, auto)
#scan-mode: auto

# enable pre-handshake tls connection (early termination) using ztls
#pre-handshake: false

# scan all ips for a host (default false)
#scan-all-ips: false

# ip version to use (4, 6) (default 4)
#ip-version: []

# display subject alternative names
#san: false

# display subject common names
#cn: false

# display subject organization name
#so: false

# display used tls version
#tls-version: false

# display used cipher
#cipher: false

# display certificate fingerprint hashes (md5,sha1,sha256)
#hash: 

# display jarm fingerprint hash
#jarm: false

# display ja3 fingerprint hash (using ztls)
#ja3: false

# display ja3s fingerprint hash (using ztls)
#ja3s: false

# display host with wildcard ssl certificate
#wildcard-cert: false

# display tls probe status
#probe-status: false

# enumerate and display supported tls versions
#version-enum: false

# enumerate and display supported cipher
#cipher-enum: false

# ciphers types to enumerate. possible values: all/secure/insecure/weak (comma-separated)
#cipher-type: all

# include client hello in json output (ztls mode only)
#client-hello: false

# include server hello in json output (ztls mode only)
#server-hello: false

# display certificate serial number
#serial: false

# enable certificate transparency logs streaming mode
#ct-logs: false

# start streaming each ct log from index 0
#ctl-beginning: false

# custom start index per log using source id: <sourceid>=<index> (e.g. google_xenon2025h2=12345)
#ctl-index: []

# display host with host expired certificate
#expired: false

# display host with self-signed certificate
#self-signed: false

# display host with mismatched certificate
#mismatched: false

# display host with revoked certificate (warning: downloads full crls/ocsp per cert; high memory/network cost at scale — off by default)
#revoked: false

# display host with untrusted certificate
#untrusted: false

# path to the tlsx configuration file
#config: 

# list of resolvers to use
#resolvers: []

# client certificate authority file
#cacert: 

# ciphers to use with tls connection
#cipher-input: []

# tls sni hostname to use
#sni: []

# use random sni when empty
#random-sni: false

# perform reverse ptr to retrieve sni from ip
#rev-ptr-sni: false

# minimum tls version to accept (ssl30,tls10,tls11,tls12,tls13)
#min-version: 

# maximum tls version to accept (ssl30,tls10,tls11,tls12,tls13)
#max-version: 

# include certificates in json output (pem format)
#certificate: false

# include certificates chain in json output
#tls-chain: false

# enable verification of server certificate
#verify-cert: false

# openssl binary path
#openssl-binary: 

# treat revocation check errors as revoked (requires -revoked)
#hardfail: false

# socks5 proxy to use for tlsx
#proxy: 

# number of concurrent threads to process
#concurrency: 300

# cipher enum concurrency for each target
#cipher-concurrency: 10

# tls connection timeout in seconds
#timeout: 5

# number of retries to perform for failures
#retry: 3

# duration to wait between each connection per thread (eg: 200ms, 1s)
#delay: 

# update tlsx to latest version
#update: false

# disable automatic tlsx update check
#disable-update-check: false

# file to write output to
#output: 

# display json format output
#json: false

# display unique hostname from ssl certificate response
#dns: false

# display tls response only
#resp-only: false

# display silent output
#silent: false

# disable colors in cli output
#no-color: false

# display verbose output
#verbose: false

# display project version
#version: false

# upload or view output in the pdcp ui dashboard
#dashboard: false

# upload tlsx output file (jsonl format) to the pdcp ui dashboard
#dashboard-upload: 

# pdcp api key for authentication
#auth: 

# upload asset results to a specified team id
#team-id: 

# upload new assets to an existing asset id
#asset-id: 

# asset group name
#asset-name: 

# run diagnostic check up
#hc: false