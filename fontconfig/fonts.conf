<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  fonts.conf — Pi / pwnholic user font configuration
  Force Iosevka for ALL generic families (serif, sans-serif, monospace,
  cursive, fantasy) so the whole desktop uses the Iosevka design.
  Non-Latin glyphs (CJK, Arabic, Emoji, Math) fall back to Noto fonts.
-->
<fontconfig>

  <!-- ============ 1. Force Iosevka everywhere (generic families) ============ -->

  <!-- serif / UI style serif -->
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Iosevka Etoile</family>
      <family>Iosevka</family>
    </prefer>
  </alias>

  <!-- sans-serif -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Iosevka Aile</family>
      <family>Iosevka</family>
    </prefer>
  </alias>

  <!-- monospace -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Iosevka</family>
      <family>Iosevka Term Slab</family>
    </prefer>
  </alias>

  <!-- cursive (handwritten-style generics) -->
  <alias binding="strong">
    <family>cursive</family>
    <prefer>
      <family>Iosevka Etoile</family>
      <family>Iosevka</family>
    </prefer>
  </alias>

  <!-- fantasy (decorative generics) -->
  <alias binding="strong">
    <family>fantasy</family>
    <prefer>
      <family>Iosevka Aile</family>
      <family>Iosevka</family>
    </prefer>
  </alias>

  <!-- math / symbol generics: keep the math-capable system fonts -->
  <alias binding="strong">
    <family>math</family>
    <prefer>
      <family>Noto Sans Math</family>
      <family>DejaVu Math TeX Gyre</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- ============ 2. Non-Latin glyph fallback for Iosevka ============ -->

  <match target="pattern">
    <test qual="any" name="family">
      <string>Iosevka</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans CJK JP</string>
      <string>Noto Sans CJK KR</string>
      <string>Noto Sans Mono</string>
      <string>Noto Sans Math</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Iosevka Etoile</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
      <string>Noto Serif</string>
      <string>Noto Serif CJK SC</string>
      <string>Noto Serif CJK JP</string>
      <string>Noto Serif CJK KR</string>
      <string>Noto Sans Math</string>
      <string>DejaVu Serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Iosevka Aile</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans CJK JP</string>
      <string>Noto Sans CJK KR</string>
      <string>Noto Sans Math</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Iosevka Term Slab</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans CJK JP</string>
      <string>Noto Sans CJK KR</string>
      <string>Noto Sans Mono</string>
      <string>Noto Sans Math</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <!-- ============ 3. Hinting / rendering tweaks (optional) ============ -->

  <match target="font">
    <test name="family">
      <string>Iosevka</string>
    </test>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family">
      <string>Iosevka Etoile</string>
    </test>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family">
      <string>Iosevka Aile</string>
    </test>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family">
      <string>Iosevka Term Slab</string>
    </test>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
  </match>

</fontconfig>
