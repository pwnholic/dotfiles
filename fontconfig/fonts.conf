<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  ── Iosevka Nerd Font sebagai default sistem ────────────────────────
  niri TIDAK punya opsi `font` di config. Dia merender teks UI
  (hotkey overlay, overview, exit dialog, recent-windows) lewat
  fontconfig → generic sans-serif. File ini mengarahkan semua generic
  family ke Iosevka dengan binding="strong" agar tidak ditimpa default
  bawaan distro (Noto).

  BERSIFAT GLOBAL → juga mengubah app GTK/Qt/Firefox yang memakai
  generic sans/serif/monospace. App yang request family spesifik tetap;
  ubah via `gsettings set org.gnome.desktop.interface font-name ...`
  bila ingin konsisten 100%.

  Varian terpasang:
    • Iosevka Nerd Font       (NF)  → sans/serif (UI, estetika monospace)
    • Iosevka Nerd Font Mono  (NFM) → monospace (terminal/kode, match kitty)
    • Iosevka Nerd Font Propo (NFP) → proporsional (ganti sans/serif ke
      varian ini bila ingin body text proporsional, bukan monospace)
-->
<fontconfig>
  <!-- sans / sans-serif → Iosevka Nerd Font -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Iosevka Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Iosevka Nerd Font</string>
    </edit>
  </match>

  <!-- serif → Iosevka (biar seragam) -->
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Iosevka Nerd Font</string>
    </edit>
  </match>

  <!-- monospace → varian Mono (ketat, sejajar kitty) -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Iosevka Nerd Font Mono</string>
    </edit>
  </match>
</fontconfig>
