<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">

<fontconfig>
  <!-- ============================================================
       GENERIC FAMILY ALIASES
       ============================================================ -->

  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Iosevka Nerd Font</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Iosevka Nerd Font</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>IosevkaTermSlab Nerd Font Mono</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>cursive</family>
    <prefer>
      <family>Iosevka Nerd Font</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>fantasy</family>
    <prefer>
      <family>IosevkaTermSlab Nerd Font</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>math</family>
    <prefer>
      <family>Noto Sans Math</family>
      <family>DejaVu Math TeX Gyre</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>


  <!-- ============================================================
       DEFAULT IOSEVKA WEIGHT POLICY

       Goals:
         no weight       -> Medium
         Regular / 400   -> Medium
         Medium / 500    -> Medium
         Light           -> Light
         Semibold        -> Semibold
         Bold            -> Bold

       Fontconfig internal weights:
         regular = 80
         medium  = 100
         semibold = 180
         bold = 200
       ============================================================ -->


  <!-- ============================================================
       Iosevka Nerd Font
       ============================================================ -->

  <!-- Add Medium as fallback when weight is missing. -->
  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>Iosevka Nerd Font</string>
    </test>

    <edit name="weight" mode="append">
      <const>medium</const>
    </edit>
  </match>

  <!-- Explicit Regular -> Medium -->
  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>Iosevka Nerd Font</string>
    </test>

    <test qual="any" name="weight" compare="eq">
      <const>regular</const>
    </test>

    <edit name="weight" mode="assign">
      <const>medium</const>
    </edit>
  </match>


  <!-- ============================================================
       Iosevka Nerd Font Mono
       ============================================================ -->

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>Iosevka Nerd Font Mono</string>
    </test>

    <edit name="weight" mode="append">
      <const>medium</const>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>Iosevka Nerd Font Mono</string>
    </test>

    <test qual="any" name="weight" compare="eq">
      <const>regular</const>
    </test>

    <edit name="weight" mode="assign">
      <const>medium</const>
    </edit>
  </match>


  <!-- ============================================================
       Iosevka Nerd Font Propo
       ============================================================ -->

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>Iosevka Nerd Font Propo</string>
    </test>

    <edit name="weight" mode="append">
      <const>medium</const>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>Iosevka Nerd Font Propo</string>
    </test>

    <test qual="any" name="weight" compare="eq">
      <const>regular</const>
    </test>

    <edit name="weight" mode="assign">
      <const>medium</const>
    </edit>
  </match>


  <!-- ============================================================
       IosevkaTermSlab Nerd Font
       ============================================================ -->

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>IosevkaTermSlab Nerd Font</string>
    </test>

    <edit name="weight" mode="append">
      <const>medium</const>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>IosevkaTermSlab Nerd Font</string>
    </test>

    <test qual="any" name="weight" compare="eq">
      <const>regular</const>
    </test>

    <edit name="weight" mode="assign">
      <const>medium</const>
    </edit>
  </match>


  <!-- ============================================================
       IosevkaTermSlab Nerd Font Mono
       ============================================================ -->

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>IosevkaTermSlab Nerd Font Mono</string>
    </test>

    <edit name="weight" mode="append">
      <const>medium</const>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>IosevkaTermSlab Nerd Font Mono</string>
    </test>

    <test qual="any" name="weight" compare="eq">
      <const>regular</const>
    </test>

    <edit name="weight" mode="assign">
      <const>medium</const>
    </edit>
  </match>


  <!-- ============================================================
       FALLBACK CHAINS
       ============================================================ -->

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>Iosevka Nerd Font</string>
    </test>

    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans CJK JP</string>
      <string>Noto Sans CJK KR</string>
      <string>Noto Sans Math</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>Iosevka Nerd Font Mono</string>
    </test>

    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans CJK JP</string>
      <string>Noto Sans CJK KR</string>
      <string>Noto Sans Mono</string>
      <string>Noto Sans Math</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>Iosevka Nerd Font Propo</string>
    </test>

    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans CJK JP</string>
      <string>Noto Sans CJK KR</string>
      <string>Noto Sans Math</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>IosevkaTermSlab Nerd Font</string>
    </test>

    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans CJK JP</string>
      <string>Noto Sans CJK KR</string>
      <string>Noto Sans Mono</string>
      <string>Noto Sans Math</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>IosevkaTermSlab Nerd Font Mono</string>
    </test>

    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans CJK JP</string>
      <string>Noto Sans CJK KR</string>
      <string>Noto Sans Mono</string>
      <string>Noto Sans Math</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>


  <!-- ============================================================
       FONT RENDERING

       Deliberately conservative:
       no forced rgba/subpixel order
       no forced lcdfilter
       no assumed hintstyle
       ============================================================ -->

  <match target="font">
    <test qual="any" name="family" compare="eq">
      <string>Iosevka Nerd Font</string>
    </test>

    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>

    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
  </match>

  <match target="font">
    <test qual="any" name="family" compare="eq">
      <string>Iosevka Nerd Font Mono</string>
    </test>

    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>

    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
  </match>

  <match target="font">
    <test qual="any" name="family" compare="eq">
      <string>Iosevka Nerd Font Propo</string>
    </test>

    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>

    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
  </match>

  <match target="font">
    <test qual="any" name="family" compare="eq">
      <string>IosevkaTermSlab Nerd Font</string>
    </test>

    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>

    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
  </match>

  <match target="font">
    <test qual="any" name="family" compare="eq">
      <string>IosevkaTermSlab Nerd Font Mono</string>
    </test>

    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>

    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
  </match>

</fontconfig>
