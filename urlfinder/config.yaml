# urlfinder config file
# generated by https://github.com/projectdiscovery/goflags

# target domain / list to find urls for
#list: []

# specific sources to use for discovery (-s alienvault,commoncrawl). use -ls to display all available sources.
#sources: []

# sources to exclude from enumeration (-es alienvault,commoncrawl)
#exclude-sources: []

# use all sources for enumeration (slow)
#all: false

# in scope url regex to be followed by urlfinder
#url-scope: []

# out of scope url regex to be excluded by urlfinder
#url-out-scope: []

# pre-defined scope field (dn,rdn,fqdn) or custom regex (e.g., '(company-staging.io|company.com)')
#field-scope: rdn

# disables host based default scope
#no-scope: false

# display external endpoint from scoped crawling
#display-out-scope: false

# url or list of url to match (file or comma separated)
#match: []

#  url or list of url to filter (file or comma separated)
#filter: []

# maximum number of http requests to send per second (global)
#rate-limit: 0

# maximum number of http requests to send per second four providers in key=value format (-rls hackertarget=10/m)
#rate-limits: ["waybackarchive=15/m"]

# update urlfinder to latest version
#update: false

# disable automatic urlfinder update check
#disable-update-check: false

# file to write output to
#output: 

# write output in jsonl(ines) format
#jsonl: false

# directory to write output file
#output-dir: 

# include all sources in the output (-json only)
#collect-sources: false

# flag config file
#config: /home/pwnholic/.config/urlfinder/config.yaml

# provider config file
#provider-config: /home/pwnholic/.config/urlfinder/provider-config.yaml

# http proxy to use with urlfinder
#proxy: 

# show only urls in output
#silent: false

# show version of urlfinder
#version: false

# show verbose output
#v: false

# disable color in output
#no-color: false

# list all available sources
#list-sources: false

# report source statistics
#stats: false

# seconds to wait before timing out
#timeout: 30

# minutes to wait for enumeration results
#max-time: 10