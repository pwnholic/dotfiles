# ════════════════════════════════════════════════════════════════════
#  Widget Definitions — per-widget settings for the bar
#  Docs: https://docs.noctalia.dev/v5/bar/widgets/
#  Gestures/bindings: https://docs.noctalia.dev/v5/bar/actions/
# ════════════════════════════════════════════════════════════════════
#
#  Scroll & click behavior is now driven by gesture bindings under
#  `[widget.<name>.actions]`. The deprecated `enable_scroll`,
#  `scroll_step`, `primary_click`, and `middle_click_opens_widget_settings`
#  keys are removed here — sensible defaults already provide scroll on
#  workspaces/taskbar/volume/brightness/media and middle-click-opens-settings.

# ── Clock ──────────────────────────────────────────────────────────
[widget.clock]
color = "#a9b1d6"                   # Tokyo Night foreground (lavender)
format = "{:%H:%M}"
tooltip_format = "{:%A, %B %d, %Y}"

# ── Launcher Button ────────────────────────────────────────────────
[widget.launcher]
icon_color = "#a9b1d6"
glyph = "menu-2"

# ── Workspaces ────────────────────────────────────────────────────
[widget.workspaces]
style = "regular"                 # regular | minimal | focus_hint
display = "name"                  # none | id | name (named workspaces show names)
max_label_chars = 5
pill_scale = 1.0
active_pill_size = 2.0
inactive_pill_size = 1.0
focused_color = "primary"
occupied_color = "secondary"
empty_color = "surface_variant"
urgent_color = "error"
focused_output_only = false
labels_only_when_occupied = false
hide_when_empty = true

# ── Taskbar ────────────────────────────────────────────────────────
[widget.taskbar]
pinned = ["firefox", "kitty", "nautilus"]
pinned_opacity = 0.5
group_by_workspace = true
show_all_outputs = false
only_active_workspace = false
show_workspace_label = true
workspace_label_placement = "corner"
hide_empty_workspaces = true
workspace_group_capsule = true
group_single_icon_per_app = true
show_active_indicator = true
active_opacity = 1.0
inactive_opacity = 0.8
focused_color = "primary"
occupied_color = "secondary"
empty_color = "secondary"
urgent_color = "error"
focused_output_only = false

# ── Active Window ──────────────────────────────────────────────────
[widget.active_window]
min_length = 80
max_length = 200
icon_size = 14
title_scroll = "on_hover"
display = "icon_and_text"
show_empty_label = false

# ── Volume ────────────────────────────────────────────────────────
[widget.volume]
color = "#7dcfff"      # Tokyo Night cyan
icon_color = "#7dcfff"
device = "output"
show_label = true
mute_color = "error"

# Scroll adjusts output volume in 5% steps (explicit, matches old scroll_step).
[widget.volume.actions]
scroll_up = "volume-up 5%"
scroll_down = "volume-down 5%"

# ── Brightness ────────────────────────────────────────────────────
[widget.brightness]
color = "#e0af68"      # Tokyo Night yellow
icon_color = "#e0af68"
show_label = true

# Scroll adjusts the current monitor in 5% steps.
[widget.brightness.actions]
scroll_up = "brightness-up current 5%"
scroll_down = "brightness-down current 5%"

# ── Battery ───────────────────────────────────────────────────────
[widget.battery]
color = "#9ece6a"        # Tokyo Night green
icon_color = "#9ece6a"
display_mode = "graphic" # graphic = battery shape with fill
show_label = true
device = "auto"

# ── Media ─────────────────────────────────────────────────────────
[widget.media]
color = "#a9b1d6"
album_art_only = false    # show album art + track title
hide_artist = false
artist_first = true
min_length = 80
max_length = 200
art_size = 24
title_scroll = "on_hover"
hide_when_no_media = true

# ── Weather ───────────────────────────────────────────────────────
# Requires [weather] enabled = true (see services.toml).
[widget.weather]
max_length = 160
show_condition = true
show_temperature = true

# ── Notifications ─────────────────────────────────────────────────
[widget.notifications]
icon_color = "#a9b1d6"
hide_when_no_unread = false

# ── Tray ──────────────────────────────────────────────────────────
[widget.tray]
hidden = []
pinned = []
drawer = true
detached_panel = true
drawer_columns = 3

# ── Network ───────────────────────────────────────────────────────
[widget.network]
show_label = false

# ── Bluetooth ─────────────────────────────────────────────────────
[widget.bluetooth]
show_label = false

# ── Control Center Button ────────────────────────────────────────
[widget.control-center]
icon_color = "#7aa2f7"
glyph = "noctalia"

# ── Session Button ───────────────────────────────────────────────
[widget.session]
glyph = "shutdown"

# ── Clipboard ────────────────────────────────────────────────────
[widget.clipboard]
glyph = "clipboard-list"

# ── Screenshot ────────────────────────────────────────────────────
# Default left click = screenshot-region; right click opens the capture menu.
[widget.screenshot]
glyph = "screenshot"

# ════════════════════════════════════════════════════════════════════
#  System Monitor widgets (sysmon) — CPU / GPU / RAM / Network
#  Poll intervals & thresholds: services.toml → [system.monitor]
#  NVML present  → GPU stats work (RTX 5050). Net iface: wlan0.
# ════════════════════════════════════════════════════════════════════

# ── CPU usage (text) ─────────────────────────────────────────────
[widget.cpu]
type = "sysmon"
capsule = false
color = "#7aa2f7"      # Tokyo Night blue (text)
icon_color = "#7aa2f7" # Tokyo Night blue (icon)
stat = "cpu_usage"
display = "text"
show_label = true

# ── CPU temperature (text) ────────────────────────────────────────
[widget.cpu-temp]
type = "sysmon"
capsule = false
color = "#7aa2f7"
icon_color = "#7aa2f7"
stat = "cpu_temp"
display = "text"
show_label = true

# ── GPU usage (text, NVML) ───────────────────────────────────────
[widget.gpu]
type = "sysmon"
capsule = false
color = "#bb9af7"      # Tokyo Night purple
icon_color = "#bb9af7"
stat = "gpu_usage"
display = "text"
show_label = true

# ── GPU temperature (text, NVML) ──────────────────────────────────
[widget.gpu-temp]
type = "sysmon"
capsule = false
color = "#bb9af7"
icon_color = "#bb9af7"
stat = "gpu_temp"
display = "text"
show_label = true

# ── RAM usage (text) ─────────────────────────────────────────────
[widget.ram]
type = "sysmon"
capsule = false
color = "#73daca"      # Tokyo Night teal
icon_color = "#73daca"
stat = "ram_pct"
display = "text"
show_label = true

# ── Network download (text, wlan0) ────────────────────────────────
[widget.net-down]
type = "sysmon"
capsule = false
color = "#7dcfff"            # Tokyo Night cyan (download)
icon_color = "#7dcfff"
stat = "net_rx"
interface = "wlan0"
display = "text"
network_speed_unit = "auto"
network_speed_compact = true
show_label = true
glyph = "arrow-down"

# ── Network upload (text, wlan0) ──────────────────────────────────
[widget.net-up]
type = "sysmon"
capsule = false
color = "#7aa2f7"            # Tokyo Night blue (upload)
icon_color = "#7aa2f7"
stat = "net_tx"
interface = "wlan0"
display = "text"
network_speed_unit = "auto"
network_speed_compact = true
show_label = true
glyph = "arrow-up"

# ── Pomodoro timer (thepunkoff/pomodoro) ─────────────────────────
[widget.pomodoro]
type = "thepunkoff/pomodoro:widget"
color = "#bb9af7"                   # Tokyo Night purple
icon_color = "#73daca"
