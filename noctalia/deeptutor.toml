# DeepTutor toggle widget
# Klik kiri: deeptutor start --detach  |  Klik kanan: deeptutor stop

[widget.deeptutor]
type = "custom_button"
glyph = "brain"
label = "DeepTutor"
peek = true
peek_delay_ms = 150
tooltip = "DeepTutor - left: start, right: stop"
capsule_border = "primary"
color = "primary"
icon_color = "primary"

[widget.deeptutor.actions]
left = 'exec /home/pwnholic/.local/bin/deeptutor start --detach && /usr/bin/noctalia msg notification-show DeepTutor "DeepTutor started"'
right = 'exec /home/pwnholic/.local/bin/deeptutor stop && /usr/bin/noctalia msg notification-show DeepTutor "DeepTutor stopped"'
