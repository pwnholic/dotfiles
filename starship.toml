"$schema" = 'https://starship.rs/config-schema.json'

# =============================================
#  Starship - DEFAULT UI (tanpa kustomisasi tampilan)
#  Hanya pengaturan fungsional / performa.
# =============================================

# Baris kosong antara satu prompt dan berikutnya
add_newline = true

# Timeout scan direktori (ms). Default 30.
# Naikkan bila berada di folder besar membuat prompt terasa lambat.
scan_timeout = 30

# Timeout eksekusi perintah (ms). Default 500.
# Ini AMBIL peran untuk git_status & custom command — naikkan bila
# di repo besar status git sering terpotong/terlewat.
command_timeout = 1000

# Ikuti symlink saat scan. Default true.
# Set "false" bila ada symlink berulang / repo berbentuk aneh.
follow_symlinks = true

# Prompt lanjutan saat mengetik multi-baris (default "..")
# continuation_prompt = ".."

# =============================================
#  GIT
# =============================================

[git_branch]
# Tampilkan nama remote (contoh: origin/main) selain cabang lokal.
# default: false
always_show_remote = false

[git_status]
# Pakai executable `git` sistem alih-alih librari gitoxide bawaan.
# Set "true" hanya jika ada kendala di repo tertentu.
use_git_executable = false
