# ~/.config/atuin/config.toml
#
# Atuin shell history. Tuned for a multi-language dev workflow (the up arrow
# searches the current directory's history, Ctrl-R searches everything).
# Regenerate the full annotated template with the defaults reference at:
#   https://docs.atuin.sh/configuration/config/
#
# Fish integration lives in fish/config.fish (`atuin init fish | source`).

## --- Sync ---------------------------------------------------------------
auto_sync = true          # push/pull history to the sync server
update_check = true       # notify when a new atuin release is available
sync_frequency = "1m"     # sync after every minute (only checked on a command)
# sync_address = "https://api.atuin.sh"   # default cloud; set to self-host if needed

## --- Search behaviour ---------------------------------------------------
# Ctrl-R: search the FULL history from every machine.
filter_mode = "global"
search_mode = "fuzzy"

# Up arrow: only commands run in the CURRENT DIRECTORY. The classic atuin
# power-user split -- global for recall, directory for "what did I run here?".
filter_mode_shell_up_key_binding = "directory"
search_mode_shell_up_key_binding = "fuzzy"

# Treat a whole git repo as one workspace (so up-arrow inside a repo finds
# commands run anywhere under that repo, not just the exact subdirectory).
workspaces = true

## --- UI -----------------------------------------------------------------
style = "auto"             # "full" if there's room, else "compact"
inline_height = 40         # inline UI up to 40 lines; 0 = always fullscreen
show_preview = true        # preview long commands that wrap
exit_mode = "return-original"   # Esc restores whatever was typed before opening
keymap_mode = "auto"       # match the shell's current keymap (emacs/vi)
enter_accept = true        # Enter runs the command; Tab edits it first
secrets_filter = true      # never save things that look like API keys/tokens
timezone = "local"

[sync]
records = true             # sync v2 (records-based, default for new installs)

[search]
# Order of filter modes cycled through in the TUI (Ctrl-R toggles).
filters = ["global", "host", "session", "workspace", "directory", "session-preload"]

[ui]
# What to show on each history row. Directory gives "where did I run this"
# context, which beats an exact timestamp for recall.
columns = ["duration", { type = "directory", width = 20 }, "command"]

[stats]
# Group stats by subcommand so "git push" and "git pull" count separately.
common_subcommands = [
  "cargo", "docker", "git", "go", "ip", "kubectl", "npm", "pnpm",
  "podman", "systemctl", "tmux", "yarn",
]
common_prefix = ["sudo"]   # strip a leading sudo before computing stats
ignored_commands = ["cd", "ls", "ll", "la"]
